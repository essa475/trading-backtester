{% extends 'base.html' %}{% block content %}<h2>Strategy Builder</h2><form class="card form" method="post" action="/backtest"><label>Strategy Name<input name="strategy_name" value="Midpoint Retracement Strategy"></label><label>Symbol<input name="symbol" value="Step Index 100"></label><label>Timeframe<input name="timeframe" value="4H"></label><label>Formula<input name="formula" value="(previous_high + previous_low) / 2"></label><p>BUY when current candle touches formula level: Low ≤ Level ≤ High.</p><label>Initial Balance<input type="number" name="initial_balance" value="10000" step="0.01"></label><label>Risk Per Trade %<input type="number" name="risk_percent" value="1" step="0.01"></label><label>Risk Reward<input type="number" name="rr" value="2" step="0.1"></label><label>Point Value<input type="number" name="point_value" value="1" step="0.0001"></label><button class="btn">RUN BACKTEST</button></form>{% endblock %}
